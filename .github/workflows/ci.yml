name: CI

# The repository root is this directory; the actual project lives under
# certingo-academy/. All paths below are relative to the repo root.
on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + migrate + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: certingo-academy/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            certingo-academy/backend/requirements.txt
            certingo-academy/backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Alembic migrations (temporary SQLite)
        env:
          DATABASE_URL: sqlite:///./ci_migration_check.db
        run: |
          alembic upgrade head
          alembic current
          rm -f ci_migration_check.db

      - name: Pytest
        run: pytest

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: certingo-academy/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: certingo-academy/frontend/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Lint (next lint)
        run: npm run lint

      - name: Build (next build)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
