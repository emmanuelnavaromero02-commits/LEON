# Tooling configuration for the Certingo Academy backend.
#
# Only Ruff is configured here for now (linting + import sorting). The project
# still uses requirements.txt / requirements-dev.txt for dependency management;
# this file deliberately does NOT declare a [project] table so it does not turn
# the backend into an installable package.

[tool.ruff]
target-version = "py312"
line-length = 100

# Directories that are generated or vendored and must never be linted.
extend-exclude = [
    ".venv",
    "migrations/versions",  # Alembic autogenerated revisions.
]

[tool.ruff.lint]
# Conservative, low-noise rule set. We intentionally stick to the "safe" core
# checks (real bugs + import hygiene) rather than enabling stylistic rewrites
# (e.g. pyupgrade annotation modernization) that would churn the codebase
# without changing behaviour.
#   E  - pycodestyle errors
#   W  - pycodestyle warnings
#   F  - pyflakes (undefined names, unused imports/variables, etc.)
#   I  - isort (import ordering)
select = ["E", "W", "F", "I"]

# Rules that produce noise without real value for this codebase.
ignore = [
    "E501",  # line-too-long: not enforced; long strings/URLs are fine.
    "E701",  # multiple statements on one line (colon): used for terse guards.
    "E741",  # ambiguous variable name (l/I/O): occasional single-letter locals.
]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally use fixtures/imports in ways that trip some checks.
"tests/**" = ["F401", "F811", "E402"]
# Alembic environment manipulates sys.path / late imports by design.
"migrations/env.py" = ["E402", "F401"]
# Package re-exports.
"__init__.py" = ["F401"]
