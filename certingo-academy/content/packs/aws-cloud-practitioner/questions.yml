# --- Skill: ec2-basics ------------------------------------------------------ #
- skill_id: ec2-basics
  prompt: "What does Amazon EC2 primarily provide?"
  options: ["Object storage in the cloud", "Resizable virtual servers (compute capacity) in the cloud", "A managed relational database", "A content delivery network"]
  correct_answer: "Resizable virtual servers (compute capacity) in the cloud"
  difficulty: "easy"
  explanation: "Amazon EC2 (Elastic Compute Cloud) provides resizable virtual machine instances, the core IaaS compute service in AWS."
  status: "published"

- skill_id: ec2-basics
  prompt: "Which EC2 feature automatically adjusts the number of instances to match demand?"
  options: ["Elastic Load Balancing", "EC2 Auto Scaling", "Amazon Machine Image (AMI)", "Elastic IP"]
  correct_answer: "EC2 Auto Scaling"
  difficulty: "medium"
  explanation: "EC2 Auto Scaling adds or removes instances automatically based on demand or schedules, supporting elasticity and cost optimization."
  status: "published"

- skill_id: ec2-basics
  prompt: "What is an Amazon Machine Image (AMI)?"
  options: ["A monitoring dashboard for instances", "A template containing the OS and configuration used to launch an instance", "A type of EBS volume", "A billing report"]
  correct_answer: "A template containing the OS and configuration used to launch an instance"
  difficulty: "easy"
  explanation: "An AMI is a pre-configured template (OS, application server, applications) from which EC2 instances are launched."
  status: "published"

- skill_id: ec2-basics
  prompt: "A company needs to distribute incoming application traffic across multiple EC2 instances for high availability. Which service should they use?"
  options: ["Amazon Route 53 health checks only", "Elastic Load Balancing (ELB)", "Amazon CloudFront", "AWS Direct Connect"]
  correct_answer: "Elastic Load Balancing (ELB)"
  difficulty: "medium"
  explanation: "Elastic Load Balancing automatically distributes incoming traffic across multiple targets (such as EC2 instances) in one or more Availability Zones."
  status: "published"

- skill_id: ec2-basics
  prompt: "Which EC2 instance family is optimized for workloads that require high memory-to-vCPU ratios, such as in-memory databases?"
  options: ["Compute optimized (C family)", "Memory optimized (R family)", "Storage optimized (I family)", "General purpose (T family)"]
  correct_answer: "Memory optimized (R family)"
  difficulty: "hard"
  explanation: "Memory optimized instances (e.g., the R family) deliver high memory per vCPU, ideal for in-memory caches and large databases."
  status: "published"

- skill_id: ec2-basics
  prompt: "What is the key billing difference between stopping and terminating an EC2 instance?"
  options: ["Both keep charging for compute the same way", "A stopped instance stops compute charges but its EBS storage may still incur cost; a terminated instance is permanently deleted", "Terminating keeps the instance running", "Stopping permanently deletes the instance"]
  correct_answer: "A stopped instance stops compute charges but its EBS storage may still incur cost; a terminated instance is permanently deleted"
  difficulty: "medium"
  explanation: "Stopping halts compute billing while retaining the instance and its EBS volumes (which can still cost money). Terminating deletes the instance permanently."
  status: "published"

# --- Skill: s3-basics ------------------------------------------------------- #
- skill_id: s3-basics
  prompt: "What is the maximum size of a single object that can be stored in Amazon S3?"
  options: ["5 GB", "5 TB", "Unlimited", "100 GB"]
  correct_answer: "5 TB"
  difficulty: "hard"
  explanation: "While total bucket storage is effectively unlimited, a single S3 object has a 5 TB maximum size."
  status: "published"

- skill_id: s3-basics
  prompt: "Which type of storage does Amazon S3 provide?"
  options: ["Block storage", "Object storage", "File system (NFS) storage", "In-memory storage"]
  correct_answer: "Object storage"
  difficulty: "easy"
  explanation: "Amazon S3 is an object storage service. Objects are stored in buckets and accessed via APIs, not mounted like block or file storage."
  status: "published"

- skill_id: s3-basics
  prompt: "A company stores backups that are rarely accessed and needs the lowest-cost option, accepting retrieval times of minutes to hours. Which S3 storage class fits best?"
  options: ["S3 Standard", "S3 Glacier Deep Archive", "S3 Standard-IA", "S3 One Zone-IA"]
  correct_answer: "S3 Glacier Deep Archive"
  difficulty: "medium"
  explanation: "S3 Glacier Deep Archive is the lowest-cost class for long-term archives that are rarely accessed and tolerate retrieval times measured in hours."
  status: "published"

- skill_id: s3-basics
  prompt: "Which S3 feature keeps multiple versions of an object so you can recover from accidental overwrites or deletions?"
  options: ["S3 Lifecycle policies", "S3 Versioning", "S3 Transfer Acceleration", "S3 Select"]
  correct_answer: "S3 Versioning"
  difficulty: "medium"
  explanation: "S3 Versioning retains every version of an object in a bucket, allowing recovery from unintended overwrites and deletions."
  status: "published"

- skill_id: s3-basics
  prompt: "By default, who can access a newly created Amazon S3 bucket and its objects?"
  options: ["Everyone on the internet", "Only the bucket owner / account that created it", "Any authenticated AWS user globally", "Anyone with the bucket name"]
  correct_answer: "Only the bucket owner / account that created it"
  difficulty: "easy"
  explanation: "By default S3 buckets are private; only the owner has access. Public access requires explicit configuration (and Block Public Access is on by default)."
  status: "published"

- skill_id: s3-basics
  prompt: "Which S3 capability automatically moves objects between storage classes based on rules you define, to optimize cost over time?"
  options: ["S3 Lifecycle configuration", "S3 Cross-Region Replication", "S3 Object Lock", "S3 Inventory"]
  correct_answer: "S3 Lifecycle configuration"
  difficulty: "hard"
  explanation: "S3 Lifecycle rules transition objects to cheaper classes (e.g., to Standard-IA or Glacier) or expire them automatically after a set time."
  status: "published"

# --- Skill: lambda-serverless ---------------------------------------------- #
- skill_id: lambda-serverless
  prompt: "Which of the following is a characteristic of serverless computing with AWS Lambda?"
  options: ["You must manage the underlying operating system", "You pay only for the compute time you consume", "It is designed for long-running processes up to 24 hours", "You must provision instances before deploying code"]
  correct_answer: "You pay only for the compute time you consume"
  difficulty: "medium"
  explanation: "Lambda is event-driven and serverless; you are billed only for the number of requests and the execution duration, with no servers to manage."
  status: "published"

- skill_id: lambda-serverless
  prompt: "What is the maximum execution duration for a single AWS Lambda function invocation?"
  options: ["5 minutes", "15 minutes", "1 hour", "24 hours"]
  correct_answer: "15 minutes"
  difficulty: "hard"
  explanation: "A Lambda invocation can run for a maximum of 15 minutes. Longer-running tasks should use services like EC2, ECS, or AWS Batch."
  status: "published"

- skill_id: lambda-serverless
  prompt: "AWS Lambda is best described as which type of cloud service model?"
  options: ["Infrastructure as a Service (IaaS)", "Function as a Service / serverless compute", "Software as a Service (SaaS)", "Platform storage"]
  correct_answer: "Function as a Service / serverless compute"
  difficulty: "easy"
  explanation: "Lambda runs your code in response to events without provisioning or managing servers, the canonical Function-as-a-Service (serverless) model."
  status: "published"

- skill_id: lambda-serverless
  prompt: "Which scenario is the best fit for AWS Lambda?"
  options: ["A 10-hour nightly batch render job", "Resizing an image automatically whenever a file is uploaded to S3", "Running a persistent stateful database engine", "Hosting an operating system for remote desktop users"]
  correct_answer: "Resizing an image automatically whenever a file is uploaded to S3"
  difficulty: "medium"
  explanation: "Lambda excels at short, event-driven tasks. Reacting to an S3 upload to process an image is a classic serverless use case."
  status: "published"

- skill_id: lambda-serverless
  prompt: "How does AWS Lambda scale when many events arrive at once?"
  options: ["You must manually launch more instances", "It automatically scales by running more concurrent executions", "It queues all events and runs them one at a time", "It requires an Auto Scaling group to be configured"]
  correct_answer: "It automatically scales by running more concurrent executions"
  difficulty: "medium"
  explanation: "Lambda automatically scales horizontally by running additional concurrent executions as events arrive, with no manual capacity management."
  status: "published"

- skill_id: lambda-serverless
  prompt: "Which AWS service is commonly used to expose an AWS Lambda function as a RESTful HTTP endpoint?"
  options: ["Amazon API Gateway", "Amazon Route 53", "AWS Direct Connect", "Amazon EBS"]
  correct_answer: "Amazon API Gateway"
  difficulty: "easy"
  explanation: "Amazon API Gateway lets you create, publish, and secure REST/HTTP APIs that trigger Lambda functions, a core serverless pattern."
  status: "published"

# --- Skill: vpc-networking -------------------------------------------------- #
- skill_id: vpc-networking
  prompt: "What is an Amazon VPC?"
  options: ["A managed relational database", "A logically isolated section of the AWS Cloud where you launch resources in a virtual network", "A content delivery network", "A serverless compute service"]
  correct_answer: "A logically isolated section of the AWS Cloud where you launch resources in a virtual network"
  difficulty: "easy"
  explanation: "Amazon VPC (Virtual Private Cloud) lets you provision a logically isolated virtual network where you define IP ranges, subnets, and routing."
  status: "published"

- skill_id: vpc-networking
  prompt: "Which component allows instances in a private subnet to access the internet for updates while preventing inbound connections from the internet?"
  options: ["Internet Gateway", "NAT Gateway", "VPC Peering", "Virtual Private Gateway"]
  correct_answer: "NAT Gateway"
  difficulty: "hard"
  explanation: "A NAT Gateway lets private-subnet instances initiate outbound internet traffic (e.g., for updates) while blocking unsolicited inbound connections."
  status: "published"

- skill_id: vpc-networking
  prompt: "What does an Internet Gateway (IGW) provide for a VPC?"
  options: ["A connection between the VPC and the internet for public subnets", "Encryption of all VPC traffic", "Automatic database backups", "DNS resolution only"]
  correct_answer: "A connection between the VPC and the internet for public subnets"
  difficulty: "medium"
  explanation: "An Internet Gateway is a horizontally scaled component that allows communication between instances in your VPC (in public subnets) and the internet."
  status: "published"

- skill_id: vpc-networking
  prompt: "What distinguishes a public subnet from a private subnet in a VPC?"
  options: ["A public subnet has a route to an Internet Gateway; a private subnet does not", "Public subnets are larger", "Private subnets cannot contain EC2 instances", "Public subnets cannot use security groups"]
  correct_answer: "A public subnet has a route to an Internet Gateway; a private subnet does not"
  difficulty: "medium"
  explanation: "A subnet is 'public' when its route table directs internet-bound traffic to an Internet Gateway; a private subnet has no such route."
  status: "published"

- skill_id: vpc-networking
  prompt: "Which AWS networking service provides a dedicated, private physical connection between an on-premises data center and AWS?"
  options: ["AWS Site-to-Site VPN", "AWS Direct Connect", "Amazon CloudFront", "VPC Peering"]
  correct_answer: "AWS Direct Connect"
  difficulty: "medium"
  explanation: "AWS Direct Connect establishes a dedicated private network connection from on-premises to AWS, offering consistent bandwidth and lower latency than the public internet."
  status: "published"

- skill_id: vpc-networking
  prompt: "Within a single VPC, how do subnets relate to Availability Zones?"
  options: ["A subnet can span multiple Availability Zones", "Each subnet resides in exactly one Availability Zone", "Subnets are not tied to Availability Zones at all", "A subnet spans the entire Region"]
  correct_answer: "Each subnet resides in exactly one Availability Zone"
  difficulty: "hard"
  explanation: "Each VPC subnet lives in a single Availability Zone. To build highly available architectures, you create subnets across multiple AZs."
