# AWS Certified Cloud Practitioner (CLF-C02) question bank.
# Each item maps to a skill id from skills.yml. correct_answer must match one
# of the options exactly. Difficulty is one of easy|medium|hard.

# =========================================================================== #
# Domain: Cloud Concepts
# =========================================================================== #

# --- Skill: cloud-benefits -------------------------------------------------- #
- skill_id: cloud-benefits
  prompt: "Which of the following represents the concept of 'Agility' in cloud computing?"
  options: ["The ability to scale resources up", "Reducing the time to provision new resources from weeks to minutes", "Paying only for what you use", "Distributing traffic across multiple instances"]
  correct_answer: "Reducing the time to provision new resources from weeks to minutes"
  difficulty: "medium"
  explanation: "Agility refers to the speed at which you can respond to changes and innovate, turning provisioning that took weeks into minutes."
  status: "published"

- skill_id: cloud-benefits
  prompt: "What is the main financial benefit of trading capital expense (CapEx) for variable expense (OpEx) in the cloud?"
  options: ["You pay a fixed monthly fee regardless of usage", "You only pay for the computing resources you consume", "You must buy hardware up front", "You get free unlimited storage"]
  correct_answer: "You only pay for the computing resources you consume"
  difficulty: "easy"
  explanation: "The cloud lets you stop paying for data centers up front and instead pay variable costs only when you consume resources."
  status: "published"

- skill_id: cloud-benefits
  prompt: "A company wants to deploy its application closer to users worldwide to reduce latency. Which cloud benefit does this describe?"
  options: ["Economies of scale", "Going global in minutes", "Elasticity", "Capital expenditure"]
  correct_answer: "Going global in minutes"
  difficulty: "easy"
  explanation: "AWS lets you deploy in multiple Regions around the world with a few clicks, placing workloads closer to end users for lower latency."
  status: "published"

- skill_id: cloud-benefits
  prompt: "Which cloud benefit allows AWS to pass lower per-unit costs to customers because of its massive aggregated usage?"
  options: ["Elasticity", "Economies of scale", "High availability", "Agility"]
  correct_answer: "Economies of scale"
  difficulty: "medium"
  explanation: "Because hundreds of thousands of customers aggregate usage in the cloud, AWS achieves economies of scale and passes the savings on through lower prices."
  status: "published"

- skill_id: cloud-benefits
  prompt: "What is the difference between elasticity and scalability in AWS?"
  options: ["They are identical concepts", "Scalability is the ability to grow capacity; elasticity is automatically adding and removing capacity to match demand", "Elasticity only applies to storage", "Scalability only happens manually once per year"]
  correct_answer: "Scalability is the ability to grow capacity; elasticity is automatically adding and removing capacity to match demand"
  difficulty: "hard"
  explanation: "Scalability is the capability to increase capacity; elasticity automatically scales out and in (both directions) in response to real-time demand."
  status: "published"

- skill_id: cloud-benefits
  prompt: "Which of the following is NOT one of the six advantages of cloud computing as described by AWS?"
  options: ["Trade capital expense for variable expense", "Stop guessing capacity", "Increase upfront data-center spending", "Go global in minutes"]
  correct_answer: "Increase upfront data-center spending"
  difficulty: "medium"
  explanation: "The cloud lets you avoid (not increase) upfront data-center spending. Reducing CapEx is one of the six advantages."
  status: "published"

# --- Skill: pricing-fundamentals ------------------------------------------- #
- skill_id: pricing-fundamentals
  prompt: "Which three are the fundamental drivers of cost with AWS?"
  options: ["Compute, storage, and outbound data transfer", "Number of users, support plan, and Region count", "Tags, IAM roles, and VPCs", "Free tier, savings plans, and reserved instances"]
  correct_answer: "Compute, storage, and outbound data transfer"
  difficulty: "medium"
  explanation: "AWS describes the three main cost drivers as compute, storage, and outbound data transfer. Inbound data transfer is generally free."
  status: "published"

- skill_id: pricing-fundamentals
  prompt: "Under the AWS pricing model, how is most inbound data transfer (data into AWS) charged?"
  options: ["At the same rate as outbound transfer", "It is generally free", "Per request only", "Double the storage rate"]
  correct_answer: "It is generally free"
  difficulty: "easy"
  explanation: "Inbound data transfer into AWS is typically free; you are charged for outbound data transfer to the internet."
  status: "published"

- skill_id: pricing-fundamentals
  prompt: "Which EC2 purchasing option provides the largest discount in exchange for a 1- or 3-year commitment?"
  options: ["On-Demand Instances", "Spot Instances", "Reserved Instances", "Dedicated Hosts billed hourly"]
  correct_answer: "Reserved Instances"
  difficulty: "easy"
  explanation: "Reserved Instances offer up to ~72% savings versus On-Demand in exchange for a 1- or 3-year commitment."
  status: "published"

- skill_id: pricing-fundamentals
  prompt: "A workload is fault-tolerant and can be interrupted at any time. Which EC2 pricing option offers the deepest discount for it?"
  options: ["On-Demand Instances", "Spot Instances", "Reserved Instances", "Savings Plans"]
  correct_answer: "Spot Instances"
  difficulty: "medium"
  explanation: "Spot Instances use spare EC2 capacity at up to ~90% off On-Demand but can be reclaimed with a two-minute warning, ideal for interruptible workloads."
  status: "published"

- skill_id: pricing-fundamentals
  prompt: "What does the AWS Free Tier 'Always Free' category provide?"
  options: ["12 months of free usage that then expires", "Offers that do not expire as long as you stay within the limits", "A one-time credit of 100 USD", "Free usage only during a trial weekend"]
  correct_answer: "Offers that do not expire as long as you stay within the limits"
  difficulty: "medium"
  explanation: "The Free Tier has three types: 12-months-free, trials, and Always Free offers (such as the first 1 million AWS Lambda requests per month) that never expire."
  status: "published"

- skill_id: pricing-fundamentals
  prompt: "Which pricing model offers lower compute prices in exchange for a commitment to a consistent amount of usage (measured in USD/hour) across EC2, Fargate, and Lambda?"
  options: ["Spot Instances", "Savings Plans", "On-Demand", "Dedicated Hosts"]
  correct_answer: "Savings Plans"
  difficulty: "hard"
  explanation: "Savings Plans give discounts (similar to Reserved Instances) in exchange for committing to a steady spend (USD/hour) for 1 or 3 years, and apply across EC2, Fargate, and Lambda."
  status: "published"

# =========================================================================== #
# Domain: Security and Compliance
# =========================================================================== #

# --- Skill: shared-responsibility ------------------------------------------ #
- skill_id: shared-responsibility
  prompt: "In the Shared Responsibility Model, which task is the sole responsibility of the customer?"
  options: ["Physical security of data centers", "Patching the underlying virtualization layer", "Managing AWS Identity and Access Management (IAM)", "Maintaining server hardware"]
  correct_answer: "Managing AWS Identity and Access Management (IAM)"
  difficulty: "medium"
  explanation: "Customers are responsible for security 'in' the cloud, including identity and access management, while AWS handles security 'of' the cloud."
  status: "published"

- skill_id: shared-responsibility
  prompt: "Under the Shared Responsibility Model, who is responsible for security 'of' the cloud?"
  options: ["The customer", "AWS", "A third-party auditor", "It is shared 50/50 in all cases"]
  correct_answer: "AWS"
  difficulty: "easy"
  explanation: "AWS is responsible for security OF the cloud (hardware, the global infrastructure, and the foundational services); customers are responsible for security IN the cloud."
  status: "published"

- skill_id: shared-responsibility
  prompt: "For Amazon EC2, which of the following is the customer's responsibility?"
  options: ["Patching the guest operating system and applications", "Securing the physical hypervisor host", "Maintaining the data-center network cabling", "Replacing failed physical disks"]
  correct_answer: "Patching the guest operating system and applications"
  difficulty: "medium"
  explanation: "EC2 is an IaaS service: AWS manages the host and hypervisor, but the customer patches the guest OS, applications, and configures security groups."
  status: "published"

- skill_id: shared-responsibility
  prompt: "Encryption of customer data at rest and in transit is best described as which type of responsibility?"
  options: ["Always AWS's responsibility", "Always the customer's responsibility to configure, while AWS provides the tools", "Never possible in the cloud", "A responsibility handled by the ISP"]
  correct_answer: "Always the customer's responsibility to configure, while AWS provides the tools"
  difficulty: "hard"
  explanation: "AWS provides encryption capabilities (e.g., KMS, TLS), but enabling and configuring encryption of customer data is the customer's responsibility."
  status: "published"

- skill_id: shared-responsibility
  prompt: "When using a fully managed service such as Amazon S3, which responsibility shifts to AWS compared to EC2?"
  options: ["Choosing bucket access policies", "Patching the underlying operating system and infrastructure", "Classifying the data stored", "Managing user permissions"]
  correct_answer: "Patching the underlying operating system and infrastructure"
  difficulty: "medium"
  explanation: "With managed services like S3, AWS handles OS and infrastructure patching. The customer still controls data, access policies, and classification."
  status: "published"

- skill_id: shared-responsibility
  prompt: "Which of the following remains the customer's responsibility regardless of which AWS service is used?"
  options: ["Physical data-center access controls", "Customer data and who has access to it", "Hardware lifecycle management", "Hypervisor patching"]
  correct_answer: "Customer data and who has access to it"
  difficulty: "easy"
  explanation: "Customer data, and control over who can access it, is always the customer's responsibility across every AWS service model."
  status: "published"

# --- Skill: iam-basics ------------------------------------------------------ #
- skill_id: iam-basics
  prompt: "What is the AWS best practice regarding the root user account?"
  options: ["Use it for all daily administrative tasks", "Lock it away, enable MFA, and avoid using it for everyday tasks", "Share its credentials with the whole admin team", "Delete it immediately after account creation"]
  correct_answer: "Lock it away, enable MFA, and avoid using it for everyday tasks"
  difficulty: "easy"
  explanation: "The root user has unrestricted access. Best practice is to enable MFA on it, avoid daily use, and create IAM users/roles for routine work."
  status: "published"

- skill_id: iam-basics
  prompt: "Which IAM entity is best suited to grant an EC2 instance permission to read from an S3 bucket without embedding long-term credentials?"
  options: ["An IAM user with an access key stored on the instance", "An IAM role attached to the instance", "The root user credentials", "A hardcoded password in the application"]
  correct_answer: "An IAM role attached to the instance"
  difficulty: "medium"
  explanation: "IAM roles provide temporary credentials to AWS resources like EC2, avoiding the need to store long-term access keys on the instance."
  status: "published"

- skill_id: iam-basics
  prompt: "What does the principle of least privilege recommend when assigning IAM permissions?"
  options: ["Grant administrator access to everyone for convenience", "Grant only the permissions required to perform a task, and no more", "Deny all access by default forever", "Give every user the same broad policy"]
  correct_answer: "Grant only the permissions required to perform a task, and no more"
  difficulty: "easy"
  explanation: "Least privilege means giving users and services only the minimal permissions they need, reducing the blast radius of a compromise."
  status: "published"

- skill_id: iam-basics
  prompt: "An administrator wants to apply a common set of permissions to 50 developers efficiently. What is the recommended approach?"
  options: ["Attach the policy individually to each of the 50 users", "Create an IAM group, attach the policy to the group, and add the users to it", "Share one IAM user among all 50 developers", "Use the root account for all developers"]
  correct_answer: "Create an IAM group, attach the policy to the group, and add the users to it"
  difficulty: "medium"
  explanation: "IAM groups let you manage permissions for many users at once. Attach policies to the group and add users; permission changes apply to all members."
  status: "published"

- skill_id: iam-basics
  prompt: "Which security feature requires a second piece of evidence (such as a code from a device) in addition to a password when signing in?"
  options: ["Multi-Factor Authentication (MFA)", "A stronger password policy", "An IAM permissions boundary", "A VPC security group"]
  correct_answer: "Multi-Factor Authentication (MFA)"
  difficulty: "easy"
  explanation: "MFA adds a second factor (a one-time code from a hardware or virtual device) on top of the password, greatly improving sign-in security."
  status: "published"

- skill_id: iam-basics
  prompt: "In an IAM policy, what happens when an explicit Deny and an explicit Allow both match the same action?"
  options: ["The Allow wins", "The Deny wins", "The request is sent for manual review", "Both are ignored and access is granted"]
  correct_answer: "The Deny wins"
  difficulty: "hard"
  explanation: "IAM evaluation logic is deny-by-default; an explicit Deny always overrides any Allow, so the Deny takes precedence."
  status: "published"

- skill_id: iam-basics
  prompt: "Which AWS service helps you centrally manage and govern multiple AWS accounts, including consolidated billing and service control policies?"
  options: ["AWS IAM Identity Center only", "AWS Organizations", "AWS Config", "Amazon Cognito"]
  correct_answer: "AWS Organizations"
  difficulty: "medium"
  explanation: "AWS Organizations lets you group and centrally manage multiple accounts, apply Service Control Policies (SCPs), and consolidate billing."
  status: "published"

# --- Skill: security-groups-nacl ------------------------------------------- #
- skill_id: security-groups-nacl
  prompt: "A developer wants to block a specific malicious IP address from entering their VPC subnet. Which tool should be used?"
  options: ["Security Group", "Network ACL", "IAM Policy", "Route Table"]
  correct_answer: "Network ACL"
  difficulty: "hard"
  explanation: "Network ACLs support explicit Deny rules for specific IPs at the subnet level, whereas Security Groups only support Allow rules."
  status: "published"

- skill_id: security-groups-nacl
  prompt: "Which statement correctly describes a key difference between Security Groups and Network ACLs?"
  options: ["Security Groups are stateless; Network ACLs are stateful", "Security Groups are stateful; Network ACLs are stateless", "Both are stateless", "Both are stateful"]
  correct_answer: "Security Groups are stateful; Network ACLs are stateless"
  difficulty: "medium"
  explanation: "Security Groups are stateful (return traffic is automatically allowed). Network ACLs are stateless, so you must allow both inbound and outbound directions explicitly."
  status: "published"

- skill_id: security-groups-nacl
  prompt: "At which level does a Security Group operate?"
  options: ["At the subnet level", "At the instance (ENI) level", "At the VPC level only", "At the AWS Region level"]
  correct_answer: "At the instance (ENI) level"
  difficulty: "easy"
  explanation: "Security Groups are attached to elastic network interfaces of instances, acting as a virtual firewall at the instance level. NACLs operate at the subnet level."
  status: "published"

- skill_id: security-groups-nacl
  prompt: "By default, what does a newly created Security Group allow?"
  options: ["All inbound and all outbound traffic", "No inbound traffic and all outbound traffic", "All inbound traffic and no outbound traffic", "No traffic in either direction"]
  correct_answer: "No inbound traffic and all outbound traffic"
  difficulty: "medium"
  explanation: "A new Security Group denies all inbound traffic by default (no inbound rules) and allows all outbound traffic until you change the rules."
  status: "published"

- skill_id: security-groups-nacl
  prompt: "Can a Security Group rule reference another Security Group as its source?"
  options: ["No, only IP CIDR ranges are allowed", "Yes, you can reference another Security Group as the source", "Only if both are in different VPCs", "Only for outbound rules"]
  correct_answer: "Yes, you can reference another Security Group as the source"
  difficulty: "hard"
  explanation: "Security Groups can reference other Security Groups as sources/destinations, which is useful for allowing tiers (e.g., web -> app) to communicate without hardcoding IPs."
  status: "published"

- skill_id: security-groups-nacl
  prompt: "How are Network ACL rules evaluated?"
  options: ["All rules are evaluated and the most permissive wins", "In order, by rule number, from lowest to highest until a match is found", "Randomly", "Only the highest-numbered rule matters"]
  correct_answer: "In order, by rule number, from lowest to highest until a match is found"
  difficulty: "medium"
  explanation: "NACL rules are processed in ascending order by rule number; the first rule that matches the traffic is applied, so lower numbers take precedence."
  status: "published"

